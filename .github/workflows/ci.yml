name: D-Board CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Backend API
        run: npm run typecheck:api

      - name: Typecheck Frontend Web SPA
        run: npm run typecheck:web

  test-suite:
    name: Test Suite (Unit, Integration & E2E)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: d_board
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Deploy Database Schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/d_board?schema=public
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Run Backend Unit & Integration Tests (Vitest)
        env:
          NODE_ENV: test
          PORT: 5001
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/d_board?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_secret_key_at_least_32_characters_minimum
        run: npm run test:api

      - name: Run Frontend Component Tests (Vitest + RTL)
        run: npm run test:web

      - name: Run Deterministic E2E Smoke Suite
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/d_board?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_secret_key_at_least_32_characters_minimum
        run: npm run test:e2e

  build-and-audit:
    name: Production Build & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Build API Application
        run: npm run build:api

      - name: Build Web Application SPA
        run: npm run build:web

      - name: Verify Security Dependencies Audit (Explicit Residual Risk Allowlist)
        run: npm run audit
