# ==============================================================================
# Render Blueprint Specification for D-Board Free Tier Deployment
# Infrastructure:
# - API + BullMQ Worker (Render Web Service)
# - Web Frontend (Render Static Site)
# - Supabase PostgreSQL, Render Key Value / Valkey, Cloudflare R2, Brevo SMTP
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. D-Board Backend API & Embedded Background Worker
  # ----------------------------------------------------------------------------
  - type: web
    name: d-board-api
    runtime: node
    plan: free
    region: oregon # or ohio, frankfurt, singapore
    buildCommand: npm ci && npm run build:api && npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: STORAGE_DRIVER
        value: s3
      - key: ENABLE_EMBEDDED_WORKER
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromStaticSite:
          name: d-board-web
          property: url
      - key: APP_URL
        sync: false # Set to https://<d-board-api>.onrender.com in Render Dashboard
      - key: DATABASE_URL
        sync: false # Supabase Session Pooler URL on port 5432: postgresql://postgres.[project-ref]:[password]@aws-0-[region].pooler.supabase.com:5432/postgres
      - key: REDIS_URL
        sync: false # Render Key Value / Valkey internal connection string (redis://...)
      - key: S3_ENDPOINT
        sync: false # Cloudflare R2: https://<account-id>.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: d-board-files
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false

  # ----------------------------------------------------------------------------
  # 2. D-Board Web Frontend SPA
  # ----------------------------------------------------------------------------
  - type: web
    name: d-board-web
    runtime: static
    buildCommand: npm ci && npm run build:web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: d-board-api
          property: url
