# ==============================================================================
# Render Blueprint Specification for D-Board Free Tier Deployment
# Target Regions:
# - API & Key Value: Singapore
# - Static Web: Render Global CDN
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. D-Board Backend API & Embedded Background Worker
  # ----------------------------------------------------------------------------
  - type: web
    name: d-board-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: STORAGE_DRIVER
        value: s3
      - key: ENABLE_EMBEDDED_WORKER
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false # Set to https://<d-board-web>.onrender.com (Frontend public URL)
      - key: APP_URL
        sync: false # Set to https://<d-board-api>.onrender.com (API public URL)
      - key: DATABASE_URL
        sync: false # Supabase Session Pooler URL on port 5432: postgresql://postgres.[ref]:[pwd]@aws-0-[region].pooler.supabase.com:5432/postgres
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: d-board-cache
          property: connectionString
      - key: S3_ENDPOINT
        sync: false # Cloudflare R2: https://<account-id>.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: d-board-files
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Redis Cache & Job Broker (Key Value)
  # ----------------------------------------------------------------------------
  - type: keyvalue
    name: d-board-cache
    plan: free
    region: singapore
    ipAllowList: []

  # ----------------------------------------------------------------------------
  # 3. D-Board Web Frontend SPA
  # ----------------------------------------------------------------------------
  - type: web
    name: d-board-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build:web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to https://<d-board-api>.onrender.com (API public URL)
